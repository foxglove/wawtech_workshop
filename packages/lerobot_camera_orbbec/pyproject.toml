[project]
name = "lerobot_camera_orbbec"
version = "0.1.0"
description = "LeRobot camera plugin for Orbbec cameras. Real Gemini 305 behaviour is unverified on hardware."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot==0.7.0",
    "pyorbbecsdk2==2.1.3",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
