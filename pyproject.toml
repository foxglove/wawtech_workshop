[project]
name = "wawtech-workshop"
version = "0.1.0"
description = "From teleop to policy: record reBot B601 demos, curate them in Foxglove, and convert to LeRobot v3."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[rebot,hardware]==0.7.0",
    "foxglove-sdk[torch,video]>=0.31",
    "lerobot_camera_orbbec",
    "mcap",
    "numpy",
    # LeRobot 0.7's dataset writer needs PyAV 15 (`Codec.canonical_name`,
    # `OutputContainer.add_stream_from_template`). pyorbbecsdk2==2.1.3 pins
    # older av per Python version, so the override below wins. The SDK itself
    # does not import av (only one example script does).
    "av>=15,<16",
    "datasets>=4.8.0,<6",
    "pandas>=2,<3",
    "pyarrow>=21,<30",
]

[project.scripts]
build-dataset = "wawtech_workshop.dataset.cli:main"
record-episode = "wawtech_workshop.recorder.cli:main"
upload-episodes = "wawtech_workshop.upload:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# See the `av` comment in dependencies. Without this, pyorbbecsdk2's exact
# pins (av==12.3.0 on Python 3.12) win and LeRobot cannot write dataset videos.
override-dependencies = ["av>=15,<16"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lerobot_camera_orbbec = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/lerobot_camera_orbbec/tests",
]
